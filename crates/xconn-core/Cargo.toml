[package]
name = "xconn-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Async and blocking WAMP clients, routers, and transports"
readme = "README.md"

[features]
default = ["async"]
async = ["tokio", "tokio-tungstenite", "futures-util", "async-trait"]

[dependencies]
# base dependencies
wampproto = { version = "0.1.0", path = "../wampproto" }
tungstenite = {  version = "0.27.0", features = ["rustls-tls-native-roots"] }
url = { version = "2.5.4" }

# async websocket
tokio = { version = "1", features = ["full"], optional = true }
tokio-tungstenite = { version = "0.27.0", features = ["rustls-tls-native-roots"], optional = true }
futures-util = { version = "0.3.31", optional = true }
async-trait = { version = "0.1.88", optional = true }

[[example]]
name = "async_example"
path = "examples/async/main.rs"
required-features = ["async"]

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
