[package]
name = "wampproto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Sans-I/O WAMP protocol engine for clients and routers"
readme = "README.md"

[dependencies]
# serialization deps
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_cbor = "0.11.2"
serde_json = { version = "1.0.140", features = ["raw_value"] }
rmp-serde = "1.3.0"
rmp = "0.8"

# authentication deps
hex = "0.4.3"
ed25519-dalek = "2"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
pbkdf2 = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
