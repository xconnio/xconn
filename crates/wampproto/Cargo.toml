[package]
name = "wampproto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Sans-I/O WAMP protocol engine for clients and routers"
readme = "README.md"

[dependencies]
# serialization deps
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_cbor = "0.11.2"
serde_json = { version = "1.0.140", features = ["raw_value"] }
rmp-serde = "1.3.0"
rmp = "0.8"
