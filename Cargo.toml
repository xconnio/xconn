[workspace]
members = [
    "crates/xconn-framing",
    "bindings/js/wasm",
    "bindings/python",
    "bindings/ffi",
    "bindings/runtime",
    "crates/wampproto",
    "crates/xconn-core",
    "crates/xconn-crypto",
    "crates/xconn-webrtc",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/xconnio/xconn-core"

# Size-focused builds retain unwinding for the native FFI panic boundary.
[profile.native]
inherits = "release"
opt-level = "z"
lto = "thin"
codegen-units = 1

[profile.browser]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

# Preserve queued replies when a remote WebRTC peer resets its SCTP stream.
# See docs/sctp-patch.md for provenance and the removal condition.
[patch.crates-io]
webrtc-sctp = { git = "https://github.com/xconnio/webrtc", rev = "b4b91964e91973778c3080e0f403561f6765522b" }
webrtc-util = { git = "https://github.com/xconnio/webrtc", rev = "b4b91964e91973778c3080e0f403561f6765522b" }
