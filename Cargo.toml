[workspace]
members = [
    "bindings/python",
    "bindings/ffi",
    "bindings/runtime",
    "crates/wampproto",
    "crates/xconn-core",
    "crates/xconn-crypto",
    "crates/xconn-webrtc",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/xconnio/xconn-core"

# Size-focused builds retain unwinding for the native FFI panic boundary.
[profile.native]
inherits = "release"
opt-level = "z"
lto = "thin"
codegen-units = 1
