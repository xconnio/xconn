[workspace]
members = [
    "crates/xconn-framing",
    "bindings/js/wasm",
    "bindings/python",
    "bindings/ffi",
    "bindings/runtime",
    "crates/wampproto",
    "crates/xconn",
    "crates/xconn-crypto",
    "crates/xconn-webrtc",
]
resolver = "3"

[workspace.package]
authors = ["XConn Developers"]
edition = "2024"
license = "MIT"
repository = "https://github.com/xconnio/xconn"

# Size-focused builds retain unwinding for the native FFI panic boundary.
[profile.native]
inherits = "release"
opt-level = "z"
lto = "thin"
codegen-units = 1

[profile.browser]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

# Preserve queued SCTP replies after remote reset and support iOS interface discovery.
# See docs/sctp-patch.md for provenance and the removal condition.

[patch.crates-io]
# Preserve incoming DCEP reliability settings until the upstream fix is released.
rtc = { git = "https://github.com/webrtc-rs/rtc", rev = "70901c3df6ad92dcb87d97af3d1e2fa8a2e2ae38" }
