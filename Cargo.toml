[workspace]
members = [
    "crates/xconn-framing",
    "bindings/js/wasm",
    "bindings/python",
    "bindings/ffi",
    "bindings/runtime",
    "crates/wampproto",
    "crates/xconn",
    "crates/xconn-crypto",
    "crates/xconn-webrtc",
]
resolver = "3"

[workspace.package]
authors = ["XConn Developers"]
edition = "2024"
license = "MIT"
repository = "https://github.com/xconnio/xconn"

# Native builds retain unwinding for the FFI panic boundary.
[profile.native]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.browser]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

# Preserve queued SCTP replies after remote reset and support iOS interface discovery.
# See docs/sctp-patch.md for provenance and the removal condition.

[patch.crates-io]
# Carry the SCTP reset fix and upstream DCEP reliability fix.
rtc = { git = "https://github.com/xconnio/rtc", rev = "6d96e51dee1cf6596690d4d48b124037a1653322" }
