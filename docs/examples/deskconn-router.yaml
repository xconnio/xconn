# Staging example for Deskconn deployments. Replace the CryptoSign keys and TLS files.
version: '1'

config:
  loglevel: info

realms:
  - name: com.deskconn
    meta_api: true
    disclose_caller: true
    roles:
      - name: 'xconnio:deskconn:router'
        permissions:
          - uri: 'com.deskconn.realm.list'
            match: exact
            allow_call: true
          - uri: 'com.deskconn.account.cra.verify'
            match: exact
            allow_call: true
          - uri: 'com.deskconn.account.cryptosign.verify'
            match: exact
            allow_call: true
          - uri: 'com.deskconn.realm.add'
            match: exact
            allow_register: true
          - uri: 'com.deskconn.realm.remove'
            match: exact
            allow_register: true
      - name: 'xconnio:deskconn:cloud:service:account'
        permissions:
          - uri: 'com.deskconn.'
            match: prefix
            allow_register: true
          - uri: 'com.deskconn.realm.add'
            match: exact
            allow_call: true
          - uri: 'com.deskconn.realm.remove'
            match: exact
            allow_call: true
          - uri: 'wamp.session.kill_by_authid'
            match: exact
            allow_call: true
          - uri: 'com.deskconn.desktop.*.key.add'
            match: wildcard
            allow_publish: true
          - uri: 'com.deskconn.desktop.*.key.remove'
            match: wildcard
            allow_publish: true
          - uri: 'com.deskconn.desktop.*.detach'
            match: wildcard
            allow_publish: true
      - name: 'xconnio:deskconn:app:web'
        permissions: &signup
          - uri: 'com.deskconn.account.create'
            match: exact
            allow_call: true
          - uri: 'com.deskconn.account.verify'
            match: exact
            allow_call: true
          - uri: 'com.deskconn.account.otp.resend'
            match: exact
            allow_call: true
          - uri: 'com.deskconn.account.password.forget'
            match: exact
            allow_call: true
          - uri: 'com.deskconn.account.password.reset'
            match: exact
            allow_call: true
      - name: 'xconnio:deskconn:app:mobile'
        permissions: *signup
      - name: 'xconnio:deskconn:ci'
        permissions:
          - uri: 'com.deskconn.app.update'
            match: exact
            allow_call: true
      - name: 'user:cra'
        permissions:
          - uri: 'com.deskconn.account.login'
            match: exact
            allow_call: true
          - uri: 'com.deskconn.account.login.verify'
            match: exact
            allow_call: true
          - uri: 'com.deskconn.desktop.attach'
            match: exact
            allow_call: true
      - name: 'user:cryptosign'
        permissions:
          - uri: 'com.deskconn.webrtc.'
            match: prefix
            allow_call: true
            allow_register: true
            allow_subscribe: true
            allow_publish: true
          - uri: 'com.deskconn.organization.'
            match: prefix
            allow_call: true
          - uri: 'com.deskconn.account.principal.'
            match: prefix
            allow_call: true
          - uri: 'com.deskconn.desktop.access.'
            match: prefix
            allow_call: true
          - uri: 'com.deskconn.desktop.invitation.'
            match: prefix
            allow_call: true
          - uri: 'com.deskconn.device.'
            match: prefix
            allow_call: true
          - uri: 'com.deskconn.app.'
            match: prefix
            allow_call: true
          - uri: 'com.deskconn.account.get'
            match: exact
            allow_call: true
          - uri: 'com.deskconn.account.update'
            match: exact
            allow_call: true
          - uri: 'com.deskconn.account.delete'
            match: exact
            allow_call: true
          - uri: 'com.deskconn.desktop.list'
            match: exact
            allow_call: true
          - uri: 'com.deskconn.desktop.update'
            match: exact
            allow_call: true
          - uri: 'com.deskconn.desktop.access'
            match: exact
            allow_call: true
          - uri: 'com.deskconn.desktop.detach'
            match: exact
            allow_call: true
          - uri: 'com.deskconn.coturn.credentials.create'
            match: exact
            allow_call: true

realm_source:
  control_realm: com.deskconn
  role: 'xconnio:deskconn:router'
  list: com.deskconn.realm.list
  add: com.deskconn.realm.add
  remove: com.deskconn.realm.remove
  authentication:
    wampcra: com.deskconn.account.cra.verify
    cryptosign: com.deskconn.account.cryptosign.verify
    control_roles:
      - 'user:cra'
      - 'user:cryptosign'
    realm_roles:
      - name: 'user:member'
        permissions:
          - uri: 'com.deskconn.'
            match: prefix
            allow_call: true
          - uri: 'com.deskconn.remotecontrol.'
            match: prefix
            allow_call: true
          - uri: 'com.deskconn.media.'
            match: prefix
            allow_call: true
          - uri: 'com.deskconn.webrtc.answerer.on_candidate'
            match: exact
            allow_publish: true
          - uri: 'com.deskconn.webrtc.offerer.on_candidate'
            match: exact
            allow_subscribe: true
      - name: 'user:owner'
        permissions: &machine_admin
          - uri: 'com.deskconn.'
            match: prefix
            allow_call: true
          - uri: 'com.deskconn.remotecontrol.'
            match: prefix
            allow_call: true
          - uri: 'com.deskconn.media.'
            match: prefix
            allow_call: true
          - uri: 'com.deskconn.webrtc.answerer.on_candidate'
            match: exact
            allow_publish: true
          - uri: 'com.deskconn.webrtc.offerer.on_candidate'
            match: exact
            allow_subscribe: true
          - uri: 'com.deskconn.admin.'
            match: prefix
            allow_call: true
      - name: 'user:admin'
        permissions: *machine_admin
    realm_machine_role:
      name: 'xconnio:deskconn:desktop:{authid}'
      permissions:
        - uri: 'com.deskconn.'
          match: prefix
          allow_register: true
        - uri: 'com.deskconn.admin.'
          match: prefix
          allow_register: true
        - uri: 'com.deskconn.remotecontrol.'
          match: prefix
          allow_register: true
        - uri: 'com.deskconn.media.'
          match: prefix
          allow_register: true
        - uri: 'com.deskconn.webrtc.answerer.on_candidate'
          match: exact
          allow_subscribe: true
        - uri: 'wamp.session.on_leave'
          match: exact
          allow_subscribe: true
        - uri: 'com.deskconn.webrtc.offerer.on_candidate'
          match: exact
          allow_publish: true
        - uri: 'com.deskconn.desktop.detach'
          match: exact
          allow_call: true
    control_machine_role:
      name: 'xconnio:deskconn:desktop:{authid}'
      permissions:
        - uri: 'com.deskconn.desktop.access.key.list'
          match: exact
          allow_call: true
        - uri: 'com.deskconn.coturn.credentials.create'
          match: exact
          allow_call: true
        - uri: 'com.deskconn.desktop.{authid}.key.add'
          match: exact
          allow_subscribe: true
        - uri: 'com.deskconn.desktop.{authid}.key.remove'
          match: exact
          allow_subscribe: true
        - uri: 'com.deskconn.desktop.{authid}.detach'
          match: exact
          allow_subscribe: true

transports:
  - type: rawsocket
    listener: tcp
    address: 127.0.0.1:8084
    serializers: [json, cbor, msgpack]
  - type: quic
    listener: udp
    address: '0.0.0.0:8081'
    tls:
      certificate: cert.pem
      key: key.pem
  - type: webtransport
    listener: udp
    address: '0.0.0.0:8082'
    path: /wamp
    cert_hash_address: 127.0.0.1:8083

authenticators:
  cryptosign:
    - authid: deskconn-account-service
      realm: com.deskconn
      role: 'xconnio:deskconn:cloud:service:account'
      authorized_keys:
        - 'REPLACE_WITH_MANAGEMENT_PUBLIC_KEY'
    - authid: deskconn-web-app
      realm: com.deskconn
      role: 'xconnio:deskconn:app:web'
      authorized_keys:
        - 'REPLACE_WITH_WEB_PUBLIC_KEY'
    - authid: deskconn-mobile-app
      realm: com.deskconn
      role: 'xconnio:deskconn:app:mobile'
      authorized_keys:
        - 'REPLACE_WITH_MOBILE_PUBLIC_KEY'
    - authid: deskconn-ci
      realm: com.deskconn
      role: 'xconnio:deskconn:ci'
      authorized_keys:
        - 'REPLACE_WITH_CI_PUBLIC_KEY'
