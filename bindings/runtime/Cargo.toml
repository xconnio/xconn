[package]
name = "xconn-binding-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
[features]
default = []
quic = ["xconn-core/quic", "dep:quinn", "dep:rustls", "dep:rustls-native-certs"]
webtransport = ["quic", "xconn-core/webtransport"]

[dependencies]
xconn-core = { version = "0.1.0", path = "../../crates/xconn-core", default-features = false, features = ["async", "services", "crypto"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
async-trait = "0.1.88"
hex = "0.4"
base64 = "0.22"

quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }

rustls-native-certs = { version = "0.8", optional = true }
