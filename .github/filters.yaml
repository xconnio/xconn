# "every" combines each filter's positive pattern with its exclusions.
# Unrecognized non-documentation paths conservatively select all checks.
shared:
  - '**'
  - '!bindings/{go,python,dart,js}/**'
  - '!benchmarks/browser-wasm/**'
  - '!.github/workflows/{go,python,dart,browser}.yaml'
  - '!ci/test-browser.sh'
  - '!docs/**'
  - '!**/*.md'
  - '!**/LICENSE'

go:
  - '{bindings/go/**,.github/workflows/go.yaml}'
  - '!**/*.md'
  - '!**/LICENSE'

python:
  - '{bindings/python/**,.github/workflows/python.yaml}'
  - '!**/*.md'
  - '!**/LICENSE'

dart:
  - '{bindings/dart/**,.github/workflows/dart.yaml}'
  - '!**/*.md'
  - '!**/LICENSE'

browser:
  - '{bindings/js/**,benchmarks/browser-wasm/**,.github/workflows/browser.yaml,ci/test-browser.sh}'
  - '!**/*.md'
  - '!**/LICENSE'

rust:
  - '{bindings/python/**/*.rs,bindings/python/**/Cargo.toml,bindings/js/wasm/**}'
  - '!**/*.md'
  - '!**/LICENSE'

ios_sdk:
  - "{.github/workflows/ios-sdk.yaml,ci/{build-ios-sdk,test-ios-sdk}.sh,\
    ci/fixtures/ios_native_*.dart,scripts/package-native.py,bindings/ffi/{include,src}/**,\
    bindings/dart/{hook/**,pubspec.yaml,pubspec.lock,lib/src/{native,native_sdk,native_transport}.dart}}"

windows_sdk:
  - "{.github/workflows/windows-sdk.yaml,ci/{check-native-release,test-native-sdk,test-windows-sdk}.sh,\
    scripts/package-native.py,bindings/ffi/{include,src}/**,bindings/go/internal/native/**}"
