name: Browser binding
on:
  workflow_call:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-browser
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: bindings/js/package-lock.json
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - uses: actions/cache@v4
        id: bindgen
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm2es6js
          key: wasm-bindgen-${{ runner.os }}-${{ runner.arch }}-0.2.129
      - if: steps.bindgen.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked --force
      - run: sudo apt-get update && sudo apt-get install -y binaryen
      - uses: ./.github/actions/ci-artifacts
        with:
          reference: 'true'
          helpers: 'true'
      - run: ci/test-browser.sh "${{ github.workspace }}/target/reference/xconn-go-reference"
        env:
          XCONN_PREBUILT_HELPERS: '1'
          CHROMIUM_BIN: ${{ steps.chrome.outputs.chrome-path }}
