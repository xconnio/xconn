name: Native SDK release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, such as v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: SDK (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      EXPECTED_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'
          cache-dependency-path: bindings/go/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-release-${{ matrix.target }}
      - name: Check release version and host
        run: ci/check-native-release.sh
      - name: Package shared SDK
        run: python3 scripts/package-native.py --profile native target/native-dist
      - name: Package static Linux SDK
        if: runner.os == 'Linux'
        run: python3 scripts/package-native.py --static --profile native target/native-dist
      - name: Test packaged SDK linking
        run: ci/test-native-sdk.sh target/native-dist
      - uses: actions/upload-artifact@v4
        with:
          name: native-sdk-${{ matrix.target }}
          path: target/native-dist/*
          if-no-files-found: error
          compression-level: 0

  android:
    name: SDK (aarch64-linux-android)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      EXPECTED_TARGET: x86_64-unknown-linux-gnu
      ANDROID_NDK_VERSION: '28.2.13676358'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-release-aarch64-linux-android
      - name: Check release version and build host
        run: ci/check-native-release.sh
      - name: Install Android NDK
        run: sdkmanager "ndk;$ANDROID_NDK_VERSION"
      - name: Package Android ARM64 SDK
        run: >-
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          ci/build-android-sdk.sh target/native-dist
      - name: Check Android ABI and NDK linking
        run: >-
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          ci/test-android-sdk.sh target/native-dist
      - uses: actions/upload-artifact@v4
        with:
          name: native-sdk-aarch64-linux-android
          path: target/native-dist/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish SDK archives
    timeout-minutes: 10
    needs: [build, android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          pattern: native-sdk-*
          path: native-dist
          merge-multiple: true
      - name: Verify checksums and create release
        run: ci/publish-native-sdk.sh "$RELEASE_TAG" native-dist
