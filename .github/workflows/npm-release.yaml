name: npm release

on:
  push:
    tags:
      - 'bindings/js/v*'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested package (for retrying a failed release)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-browser
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: bindings/js/package-lock.json
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - uses: actions/cache@v4
        id: bindgen
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm2es6js
          key: wasm-bindgen-${{ runner.os }}-${{ runner.arch }}-0.2.129
      - if: steps.bindgen.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked --force
      - run: sudo apt-get update && sudo apt-get install -y binaryen
      - name: Build and test npm package
        run: ci/build-npm-release.sh
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          CHROMIUM_BIN: ${{ steps.chrome.outputs.chrome-path }}
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: target/npm-release/*.tgz
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' || inputs.publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: package
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm publish ./package/*.tgz --access public --provenance --ignore-scripts
