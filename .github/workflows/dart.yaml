name: Dart binding
on:
  workflow_call:
permissions:
  contents: read
jobs:
  dart:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.5'
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: dart-${{ runner.os }}-3.13.5-${{ hashFiles('bindings/dart/pubspec.lock') }}
          restore-keys: dart-${{ runner.os }}-3.13.5-
      - uses: ./.github/actions/ci-artifacts
        with:
          reference: 'true'
          native: 'true'
          helpers: 'true'
      - run: dart pub get --enforce-lockfile
        working-directory: bindings/dart
      - name: Use the native library built by this workflow
        run: |
          cat >> bindings/dart/pubspec.yaml <<'YAML'
          hooks:
            user_defines:
              xconn_core:
                native_library: ../../target/release/libxconn_ffi.so
          YAML
      - run: dart test
        working-directory: bindings/dart
        env:
          XCONN_TRANSPORT_PEER: ${{ github.workspace }}/target/debug/examples/transport_peer
          XCONN_REFERENCE_GO_BIN: ${{ github.workspace }}/target/reference/xconn-go-reference
          XCONN_DISCOVERY_BIN: ${{ github.workspace }}/target/debug/examples/discovery
      - run: dart build cli --target test/fixtures/native_asset_smoke.dart --output "$RUNNER_TEMP/xconn-dart"
        working-directory: bindings/dart
      - run: '"$RUNNER_TEMP/xconn-dart/bundle/bin/native_asset_smoke"'
