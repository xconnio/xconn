name: crates.io release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crates-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates.io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: crates-release
      - name: Check the shared release version
        if: github.event_name == 'push'
        run: python3 ci/release_version.py "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Verify the four crates without uploading
        if: github.event_name == 'workflow_dispatch'
        run: >-
          cargo publish --locked --dry-run
          -p wampproto -p xconn-framing -p xconn-crypto -p xconn-core
      - uses: rust-lang/crates-io-auth-action@v1
        if: github.event_name == 'push'
        id: auth
      - name: Publish and verify dependencies before the runtime crate
        if: github.event_name == 'push'
        run: ci/publish-crates.sh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
