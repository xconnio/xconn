name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: New release version, without v (for example 0.1.6)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare versions and changelog headings
        run: python3 ci/prepare_release.py "$VERSION"
        env:
          VERSION: ${{ inputs.version }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate the updated workspace lockfile
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open the release preparation pull request
        run: |
          gh auth setup-git
          branch="release/v$VERSION"
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null; then
            echo 'Release branch already exists; review its pull request instead' >&2
            exit 1
          else
            status=$?
            [[ "$status" == 2 ]] || exit "$status"
          fi
          git switch -c "$branch"
          git config user.name 'Code Mistri'
          git config user.email 'mistri@xconn.io'
          git add --update
          git commit -m "Prepare release $VERSION"
          git push origin "HEAD:refs/heads/$branch"
          cat > "$RUNNER_TEMP/release-body.md" <<'BODY'
          Align public package versions, internal Rust requirements, lockfiles and the SDK installer.

          Review and fill in the new changelog sections before merging. SDK checksums remain pinned to the existing release until packaging generates the new ones.

          After this PR lands and main CI passes, run **Create release tag** with the same version.
          BODY
          gh pr create --base main --head "$branch" --title "Prepare release $VERSION" \
            --body-file "$RUNNER_TEMP/release-body.md"
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
