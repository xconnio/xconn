name: Go binding
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/reference
        id: reference
      - run: cargo build --locked --release -p xconn-ffi
      - run: python3 scripts/package-native.py --stage-only target/native
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.3.0
      - run: golangci-lint run
        working-directory: bindings/go
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/target/native/lib/pkgconfig
      - run: go test -race -count=1 -timeout=120s ./...
        working-directory: bindings/go
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/target/native/lib/pkgconfig
          XCONN_REFERENCE_GO_BIN: ${{ steps.reference.outputs.binary }}
