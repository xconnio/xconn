name: Go binding
on:
  workflow_call:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/ci-artifacts
        with:
          reference: 'true'
          native: 'true'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'
          cache-dependency-path: bindings/go/go.sum
      - uses: actions/cache@v4
        id: lint-tool
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ runner.arch }}-go1.26.8-v2.3.0
      - if: steps.lint-tool.outputs.cache-hit != 'true'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.3.0
      - run: golangci-lint run
        working-directory: bindings/go
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/target/native/lib/pkgconfig
      - run: go test -race -count=1 -timeout=120s ./...
        working-directory: bindings/go
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/target/native/lib/pkgconfig
          XCONN_REFERENCE_GO_BIN: ${{ github.workspace }}/target/reference/xconn-go-reference
